# .github/workflows/build.yml
name: Java CI Build

# Triggers the workflow on push or pull request events
on:
  pull_request:
    branches: [ main ] # Only run for PRs targeting the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4 # Action to clone the repository code

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17' # Adjust this to your required Java version
        distribution: 'temurin'
        cache: 'maven' # Change to 'gradle' if using Gradle

    - name: Build the Project (Using Maven Example)
      run: |
        # Replace 'mvn package' with your actual build command
        # If using Maven:
        mvn package
        # If using Gradle:
        # ./gradlew build
        
    - name: Status Check
      run: |
        echo "CI check complete. Build success status: $?"